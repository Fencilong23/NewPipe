name: "Build unsigned release APK on master"

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: "Make gradlew executable"
        run: chmod +x ./gradlew

      - name: "Build release APK"
        run: ./gradlew assembleRelease -x formatKtlint --stacktrace

     - name: "Rename APK"
  run: |
    set -e
    APK_DIR="app/build/outputs/apk/release"
    echo "=== Contents of $APK_DIR ==="
    ls -la "$APK_DIR" || { echo "::error::APK directory not found"; exit 1; }

    if [ -f "$APK_DIR/output-metadata.json" ]; then
      VERSION_NAME="$(jq -r '.elements[0].versionName' "$APK_DIR/output-metadata.json")"
    else
      VERSION_NAME="unknown"
    fi

    echo "Version name: $VERSION_NAME" >> "$GITHUB_STEP_SUMMARY"

    mv "$APK_DIR"/*.apk "$APK_DIR/NewPipe_v${VERSION_NAME}.apk"   

      - name: "Upload APK"
        uses: actions/upload-artifact@v7
        with:
          name: app
          path: app/build/outputs/apk/release/*.apk   
